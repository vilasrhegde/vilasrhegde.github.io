<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skills mocks</title>
<style>
:root{--bg:#e8eff5;--s1:#f4f8fb;--s2:#fff;--ink:#13202c;--mute:#435465;--line:rgba(19,32,44,.18);--acc:#b4442a;--c1:#b4442a;--c2:#2f6f9f;--c3:#4f7a2e;--c4:#8a6a3b;--serif:"Iowan Old Style",Palatino,Georgia,serif;--sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);padding:28px clamp(14px,4vw,48px) 80px}
h1{font:400 clamp(30px,4vw,48px)/1.05 var(--serif);margin:0 0 6px}p.lead{color:var(--mute);margin:0 0 20px;max-width:46em}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}nav button{border:1px solid var(--line);background:var(--s2);border-radius:99px;padding:9px 16px;font:600 14px var(--sans);color:var(--ink);cursor:pointer;min-height:40px}nav button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.stage{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:22px;align-items:start}@media(max-width:900px){.stage{grid-template-columns:1fr}}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative}
.det{padding:22px;position:sticky;top:16px}.det h3{font:400 30px/1.1 var(--serif);margin:0 0 4px}.det small{display:block;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;font-weight:600;font-size:12px}
.det .t{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.det .t span{border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:14px;background:var(--s2)}.det p{color:var(--mute);margin:8px 0 0;font-size:15px}
.note{margin-top:14px;font-size:14px;color:var(--mute)}.note b{color:var(--ink)}
.mock{display:none}.mock.on{display:block}svg{display:block;width:100%;height:auto}
.leg{display:flex;gap:16px;flex-wrap:wrap;padding:10px 18px 14px;color:var(--mute);font-size:14px}.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
/* A periodic */
.pt{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px}@media(max-width:560px){.pt{grid-template-columns:repeat(2,1fr)}}
.el{position:relative;aspect-ratio:1/1.05;border-radius:14px;border:1.5px solid var(--g);background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--g) 12%,#fff));padding:9px 11px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 18px -14px rgba(19,40,70,.5)}
.el:hover,.el.on,.el:focus-visible{transform:translateY(-5px) scale(1.04);box-shadow:0 18px 26px -14px color-mix(in srgb,var(--g) 70%,#000);outline:none;z-index:2}
.el .n{font:600 11px var(--sans);color:var(--mute)}.el .s{font:400 clamp(30px,4vw,44px)/1 var(--serif);color:var(--g)}.el .nm{font:600 12.5px/1.2 var(--sans)}.el .c{position:absolute;right:10px;top:9px;font:600 11px var(--sans);color:var(--g)}
/* D sunburst */
.sbwrap{padding:10px}
.arc{cursor:pointer;transition:opacity .25s,transform .25s;transform-box:fill-box;transform-origin:center}.arc:hover{opacity:.82}
.dim .arc:not(.on){opacity:.28}
/* E bubbles */
#bub{position:relative;height:600px;overflow:hidden;background:radial-gradient(circle at 30% 20%,#fff,transparent 60%)}
.bb{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center;color:#fff;font:600 12px/1.15 var(--sans);cursor:pointer;border:0;padding:6px;align-content:center;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75),var(--g) 42%,color-mix(in srgb,var(--g) 70%,#000));box-shadow:inset -6px -8px 14px rgba(0,0,0,.22),0 18px 20px -14px rgba(19,40,70,.6);transition:scale .25s}
.bb:hover,.bb.on{scale:1.08;z-index:3}.bb small{display:block;font-weight:500;opacity:.9;font-size:11px}
.sky{background:radial-gradient(120% 100% at 50% 0,#22304a,#0d1424 70%)}
.sky text{fill:#e9eefc;font:600 12px var(--sans);paint-order:stroke;stroke:#0d1424;stroke-width:3px}
</style></head><body>
<h1>Skills: five new directions</h1><p class="lead">Same sixteen skills, same tools, same links as your site. Pick the one you like (or mix: e.g. A on Work, D on Home). Hover or tap anything. Tool counts are real, from your skills data. No made-up proficiency scores.</p>
<nav role="tablist" id="tabs"></nav>
<div class="stage"><div>
 <div class="card mock" id="mA"><div class="pt" id="pt"></div><div class="leg" id="legA"></div></div>
 <div class="card mock" id="mB"><svg id="metro" viewBox="0 0 820 520"></svg><div class="leg" id="legB"></div></div>
 <div class="card mock sky" id="mC"><svg id="sky" viewBox="0 0 800 540"></svg><div class="leg" style="color:#b9c6e6" id="legC"></div></div>
 <div class="card mock" id="mD"><div class="sbwrap"><svg id="sun" viewBox="-400 -330 800 660"></svg></div><div class="leg" id="legD"></div></div>
 <div class="card mock" id="mE"><div id="bub"></div><div class="leg" id="legE"></div></div>
</div>
<aside class="card det" id="det" aria-live="polite"></aside></div>
<script>
var SK=[{"n": "Leadership", "g": "Build", "sym": "Ld", "tools": ["Mentoring", "design reviews", "code review", "test plans", "roadmaps", "cross-functional delivery", "unblocking teams"]}, {"n": "Architecture", "g": "Build", "sym": "Ar", "tools": ["System design", "API design", "design docs", "trade-off analysis", "scalability", "event-driven design"]}, {"n": "Distributed Systems", "g": "Build", "sym": "Ds", "tools": ["Kafka", "Redis", "Cassandra", "Zookeeper", "RPC", "idempotency", "retries", "consistency trade-offs"]}, {"n": "Reliability", "g": "Run", "sym": "Rl", "tools": ["Incident response", "root-cause analysis", "postmortems", "runbooks", "SLOs", "on-call", "capacity planning"]}, {"n": "Identity & Access", "g": "Run", "sym": "Id", "tools": ["IAM", "OAuth 2.0", "OIDC", "SAML", "SCIM", "SSO", "MFA", "Zero Trust", "lifecycle management"]}, {"n": "Integrations", "g": "Build", "sym": "In", "tools": ["Okta Integration Network", "connectors", "REST APIs", "webhooks", "event hooks", "Okta Workflows"]}, {"n": "Backend & APIs", "g": "Build", "sym": "Be", "tools": ["Node.js", "TypeScript", "Go", "Django", "REST", "GraphQL", "WebSockets", "PostgreSQL"]}, {"n": "Observability", "g": "Run", "sym": "Ob", "tools": ["Splunk", "Prometheus", "Grafana", "metrics", "logs", "tracing", "alerting", "dashboards"]}, {"n": "Security", "g": "Run", "sym": "Se", "tools": ["Threat modelling", "secure SDLC", "least privilege", "secrets handling", "OWASP", "auditability"]}, {"n": "Frontend", "g": "Build", "sym": "Fe", "tools": ["React", "JavaScript", "TypeScript", "GraphQL", "Apollo", "accessibility", "performance"]}, {"n": "Cloud & Containers", "g": "Run", "sym": "Cc", "tools": ["Docker", "Nginx", "load balancing", "Linux", "CI/CD pipelines", "Bash"]}, {"n": "Data & Databases", "g": "Data", "sym": "Db", "tools": ["SQL", "PostgreSQL", "Cassandra", "Redis", "ETL with SSIS and SSRS", "data modelling"]}, {"n": "GenAI", "g": "Learn", "sym": "Ai", "tools": ["LLM applications", "prompt design", "agents", "evaluation", "safe use of AI in workflows"]}, {"n": "Machine Learning", "g": "Learn", "sym": "Ml", "tools": ["Python", "scikit-learn", "TensorFlow", "NLP", "OpenCV", "classification", "forecasting"]}, {"n": "Analytics", "g": "Data", "sym": "An", "tools": ["Power BI", "pandas", "Streamlit", "dashboards", "forecasting", "data storytelling"]}, {"n": "Automation", "g": "Learn", "sym": "Au", "tools": ["Python", "Bash", "scheduled jobs", "API orchestration", "no-code workflows", "ChatOps"]}],ED=[[0, 1], [1, 2], [2, 3], [0, 3], [1, 6], [2, 6], [4, 5], [4, 8], [5, 6], [5, 15], [6, 11], [6, 9], [2, 11], [3, 7], [7, 10], [2, 7], [10, 6], [8, 5], [11, 14], [11, 13], [13, 12], [13, 14], [14, 9], [15, 12], [15, 10], [0, 5], [0, 4], [8, 2]],COL={Build:'var(--c1)',Run:'var(--c2)',Data:'var(--c4)',Learn:'var(--c3)'},GN={Build:'Build',Run:'Run',Data:'Data',Learn:'Learn from data'},NS='http://www.w3.org/2000/svg',$=function(i){return document.getElementById(i)};
function sv(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function nb(i){var r=[];ED.forEach(function(e){if(e[0]===i)r.push(e[1]);else if(e[1]===i)r.push(e[0])});return r}
function show(i){var s=SK[i],d=$('det');d.innerHTML='<small>'+GN[s.g]+'</small><h3>'+s.n+'</h3><div class="t">'+s.tools.map(function(t){return'<span>'+t+'</span>'}).join('')+'</div><p>Works closely with: '+nb(i).map(function(j){return SK[j].n}).join(', ')+'</p>';var b=d.querySelector('small');b.style.color=COL[s.g]}

function legend(id){$(id).innerHTML=Object.keys(COL).map(function(k){return'<span><i style="background:'+COL[k]+'"></i>'+GN[k]+'</span>'}).join('')}
['legA','legB','legC','legD','legE'].forEach(legend);
/* A periodic table */
SK.forEach(function(s,i){var b=document.createElement('button');b.className='el';b.style.setProperty('--g',COL[s.g]);b.innerHTML='<span class="n">'+(i+1)+'</span><span class="c">'+s.tools.length+' tools</span><span class="s">'+s.sym+'</span><span class="nm">'+s.n+'</span>';b.onclick=b.onfocus=function(){document.querySelectorAll('.el').forEach(function(x){x.classList.remove('on')});b.classList.add('on');show(i)};$('pt').appendChild(b)});
/* B metro map */
(function(){var g=$('metro'),L={Build:[0,1,2,5,6,9],Run:[3,4,7,8,10],Data:[11,14],Learn:[12,13,15]},Y={Build:90,Run:200,Data:310,Learn:420},pos={};
Object.keys(L).forEach(function(k){var n=L[k].length,x0=150,w=600;L[k].forEach(function(i,j){pos[i]={x:n==1?400:x0+j*(w/(n-1))*(n>3?1:.55)+(n>3?0:100),y:Y[k]+(k==='Learn'&&j===1?0:0)}})});
ED.forEach(function(e){var a=pos[e[0]],b=pos[e[1]];if(SK[e[0]].g!==SK[e[1]].g)sv('path',{d:'M'+a.x+' '+a.y+' C'+a.x+' '+(a.y+b.y)/2+' '+b.x+' '+(a.y+b.y)/2+' '+b.x+' '+b.y,fill:'none',stroke:'rgba(19,32,44,.22)','stroke-width':3,'stroke-dasharray':'2 6','stroke-linecap':'round'},g)});
Object.keys(L).forEach(function(k){var p=L[k].map(function(i){return pos[i]});var d='M'+p[0].x+' '+p[0].y;p.slice(1).forEach(function(q){d+=' L'+q.x+' '+q.y});sv('path',{d:d,fill:'none',stroke:COL[k],'stroke-width':12,'stroke-linecap':'round','stroke-linejoin':'round'},g);var t=sv('text',{x:p[0].x-24,y:p[0].y+4,'text-anchor':'end','font-size':13,'font-weight':700,fill:COL[k]},g);t.textContent=GN[k]+' line'});
SK.forEach(function(s,i){var p=pos[i],gg=sv('g',{style:'cursor:pointer',tabindex:0},g),inter=nb(i).some(function(j){return SK[j].g!==s.g});sv('circle',{cx:p.x,cy:p.y,r:inter?12:9,fill:'#fff',stroke:'var(--ink)','stroke-width':3.5},gg);if(inter)sv('circle',{cx:p.x,cy:p.y,r:4,fill:'var(--ink)'},gg);var t=sv('text',{x:p.x,y:p.y-22,'text-anchor':'middle','font-size':12.5,'font-weight':600,fill:'var(--ink)'},gg);t.textContent=s.n;gg.onclick=gg.onfocus=function(){show(i)}})})();
/* C constellation */
(function(){var g=$('sky'),C={Build:[[150,120],[250,70],[340,140],[260,200],[170,230],[90,190]],Run:[[470,70],[560,110],[640,70],[600,170],[510,160]],Data:[[110,380],[230,430]],Learn:[[430,330],[540,400],[650,340]]},idx={Build:[0,1,2,5,6,9],Run:[3,4,7,8,10],Data:[11,14],Learn:[12,13,15]},pos={};
for(var i=0;i<90;i++)sv('circle',{cx:(i*137)%800,cy:(i*71)%540,r:(i%5)/5+.5,fill:'#fff',opacity:.25+(i%4)/10},g);
Object.keys(idx).forEach(function(k){idx[k].forEach(function(s,j){pos[s]={x:C[k][j][0],y:C[k][j][1]}})});
ED.forEach(function(e){var a=pos[e[0]],b=pos[e[1]],same=SK[e[0]].g===SK[e[1]].g;sv('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:same?'#cfe0ff':'#7e92c4','stroke-width':same?1.6:1,'stroke-dasharray':same?'':'3 6',opacity:same?.8:.5},g)});
var NM={Build:'THE BUILDER',Run:'THE KEEPER',Data:'THE LEDGER',Learn:'THE LEARNER'};Object.keys(C).forEach(function(k){var t=sv('text',{x:C[k][0][0]-20,y:C[k][0][1]-46,'font-size':11,'letter-spacing':'.18em',opacity:.7},g);t.textContent=NM[k]});
var COLR={Build:'#ff8a6a',Run:'#6fb7ff',Data:'#ffcf7a',Learn:'#9be07a'};
SK.forEach(function(s,i){var p=pos[i],gg=sv('g',{style:'cursor:pointer',tabindex:0},g);sv('circle',{cx:p.x,cy:p.y,r:20,fill:COLR[s.g],opacity:.18},gg);sv('circle',{cx:p.x,cy:p.y,r:11,fill:COLR[s.g],opacity:.35},gg);sv('circle',{cx:p.x,cy:p.y,r:5.5,fill:'#fff'},gg);var t=sv('text',{x:p.x,y:p.y+28,'text-anchor':'middle'},gg);t.textContent=s.n;gg.onclick=gg.onfocus=function(){show(i)}})})();
/* D sunburst */
(function(){var g=$('sun'),G=['Build','Run','Data','Learn'],tot=SK.reduce(function(n,s){return n+s.tools.length},0),a0=-Math.PI/2,arcs=[];
function arc(r0,r1,a,b,gap){a+=gap;b-=gap;var x=function(r,t){return(r*Math.cos(t)).toFixed(2)+' '+(r*Math.sin(t)).toFixed(2)},big=b-a>Math.PI?1:0;return'M'+x(r1,a)+' A'+r1+' '+r1+' 0 '+big+' 1 '+x(r1,b)+' L'+x(r0,b)+' A'+r0+' '+r0+' 0 '+big+' 0 '+x(r0,a)+'Z'}
G.forEach(function(k){var mem=[];SK.forEach(function(s,i){if(s.g===k)mem.push(i)});var gs=mem.reduce(function(n,i){return n+SK[i].tools.length},0),ga=gs/tot*Math.PI*2,gb=a0+ga;
var p=sv('path',{d:arc(70,128,a0,gb,.012),fill:COL[k],'class':'arc'},g);var m=(a0+gb)/2,t=sv('text',{x:99*Math.cos(m),y:99*Math.sin(m)+4,'text-anchor':'middle','font-size':12,'font-weight':700,fill:'#fff',style:'pointer-events:none'},g);t.textContent=GN[k].split(' ')[0];
var cur=a0;mem.forEach(function(i){var w=SK[i].tools.length/tot*Math.PI*2,pp=sv('path',{d:arc(134,206,cur,cur+w,.006),fill:COL[k],opacity:.82,'class':'arc',tabindex:0},g);
var mm=cur+w/2,rot=mm*180/Math.PI,flip=Math.cos(mm)<0;var tx=sv('text',{x:0,y:4,transform:'rotate('+rot+') translate(212 0) '+(flip?'rotate(180)':''),'text-anchor':flip?'end':'start','font-size':11.5,'font-weight':600,fill:'var(--ink)',style:'pointer-events:none'},g);tx.textContent=SK[i].n;
pp.onclick=pp.onfocus=function(){show(i);var ring=SK[i].tools.length;document.querySelectorAll('#sun .arc').forEach(function(a){a.setAttribute('opacity',.3)});pp.setAttribute('opacity',1);p.setAttribute('opacity',1)};
/* tools as a thin outer ring */
var tc=cur,tw=w/SK[i].tools.length;SK[i].tools.forEach(function(){sv('path',{d:arc(292,298,tc,tc+tw,.004),fill:COL[k],opacity:.5},g);tc+=tw});cur+=w});a0=gb});
var c=sv('text',{x:0,y:-2,'text-anchor':'middle','font-size':34,'font-family':'Iowan Old Style,Georgia,serif',fill:'var(--ink)'},g);c.textContent='16';var c2=sv('text',{x:0,y:22,'text-anchor':'middle','font-size':11,'letter-spacing':'.12em',fill:'var(--mute)'},g);c2.textContent='SKILLS';})();
/* E bubbles */
(function(){var host=$('bub'),W=host.clientWidth||700,H=600,bs=SK.map(function(s,i){var r=30+s.tools.length*3.6;return{i:i,r:r,x:W/2+Math.cos(i*2.4)*i*14,y:H/2+Math.sin(i*2.4)*i*11}});
for(var it=0;it<260;it++){bs.forEach(function(a){a.x+=(W/2-a.x)*.012;a.y+=(H/2-a.y)*.014;bs.forEach(function(b){if(a===b)return;var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,m=a.r+b.r+4;if(d<m){var f=(m-d)/2/d;a.x-=dx*f;a.y-=dy*f;b.x+=dx*f;b.y+=dy*f}})})}
bs.forEach(function(b,j){var s=SK[b.i],e=document.createElement('button');e.className='bb';e.style.cssText='width:'+b.r*2+'px;height:'+b.r*2+'px;left:'+(b.x-b.r)+'px;top:'+(b.y-b.r)+'px;--g:'+COL[s.g]+';animation:fl'+(j%3)+' '+(6+j%4)+'s ease-in-out infinite alternate';e.innerHTML='<span>'+s.n+'<small>'+s.tools.length+' tools</small></span>';e.onclick=e.onfocus=function(){document.querySelectorAll('.bb').forEach(function(x){x.classList.remove('on')});e.classList.add('on');show(b.i)};host.appendChild(e)});
var st=document.createElement('style');st.textContent='@keyframes fl0{to{transform:translate(4px,-6px)}}@keyframes fl1{to{transform:translate(-5px,5px)}}@keyframes fl2{to{transform:translate(6px,4px)}}@media(prefers-reduced-motion:reduce){.bb{animation:none!important}}';document.head.appendChild(st)})();
/* tabs */
var T=[['A','Periodic table'],['B','Metro map'],['C','Constellations'],['D','Sunburst'],['E','Bubbles']];
T.forEach(function(t,k){var b=document.createElement('button');b.textContent=t[0]+'  '+t[1];b.setAttribute('role','tab');b.onclick=function(){T.forEach(function(x){$('m'+x[0]).classList.remove('on')});$('m'+t[0]).classList.add('on');[].forEach.call($('tabs').children,function(c){c.setAttribute('aria-selected',c===b)});hint()};$('tabs').appendChild(b);if(!k)b.click()});
</script></body></html>
